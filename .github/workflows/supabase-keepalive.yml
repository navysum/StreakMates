# Keeps the free-plan Supabase project from being paused.
#
# Supabase pauses a free project after about a week without database activity,
# and while it is paused <project-ref>.supabase.co stops resolving — sign-in
# fails with "server can't be found". A few real queries a day is enough to
# count as activity.
#
# Each run asks the database for one row of a few tables using the anon key.
# Signed out, RLS answers every one of them with an empty list, so nothing is
# read and nothing is written, but Postgres still runs the query.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the same anon key the app ships with

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6,18 * * *' # twice a day, 06:17 and 18:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  actions: write # for the re-enable step below
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          for table in profiles groups habits; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "$table → HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Supabase answered $status for $table. If the project is already paused, restore it from the dashboard."
              exit 1
            fi
          done

      # GitHub switches off scheduled workflows in a public repository after
      # 60 days with no commits. Re-enabling this one on every run keeps the
      # schedule alive while the code is quiet.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
